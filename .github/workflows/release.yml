name: Release

# Publishes to PyPI through Trusted Publishing and creates a GitHub Release
# when a `v*` tag is pushed. Set up the PyPI side once: on pypi.org add a
# "pending publisher" for owner `yamaaaaaa31`, repository `aioopenpyxl`,
# workflow `release.yml`, environment `pypi`; and create the `pypi`
# environment in the repository settings (optionally with required reviewers).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Check that the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $version"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Smoke-test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import aioopenpyxl; print(aioopenpyxl.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/aioopenpyxl/
    permissions:
      id-token: write   # Trusted Publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract this version's section from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything from "## [<version>]" up to (not including) the next "## " heading.
          awk -v ver="$version" '
            /^## \[/ { if (found) exit; found = index($0, "## [" ver "]") == 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $version; using a generic body."
            printf 'See CHANGELOG.md for details.\n' > release-notes.md
          fi
          printf '\n---\nInstall: `pip install aioopenpyxl==%s`\n' "$version" >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
